name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Read-only token: this workflow never writes to the repository.
permissions:
  contents: read

# A new push to the same PR cancels the run still going on the previous commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests and data validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        # Dependency groups from pyproject.toml need pip >= 25.1.
        run: |
          python -m pip install --upgrade pip
          pip install --group dev

      - name: Lint
        # --output-format=github turns findings into annotations on the PR diff.
        run: ruff check --output-format=github .

      - name: Unit tests
        run: pytest

      - name: Validate data files
        run: python scripts/validate_data.py

      - name: Check JavaScript syntax
        # Node is preinstalled on GitHub runners. Catches a broken hand edit of data/social.js or data/site.js.
        run: for f in app.js sandbox.js data/*.js; do node --check "$f"; done
