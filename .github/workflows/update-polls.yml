name: Update opinion polls

on:
  schedule:
    # Every Monday and Thursday at 06:00 UTC (07:00 in Paris during winter).
    - cron: "0 6 * * 1,4"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-polls
  cancel-in-progress: false

jobs:
  update-polls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --group scripts

      - name: Update polls
        run: python scripts/update_polls.py

      - name: Update social followers
        # Le Podium 2027 (X, Instagram, TikTok, Facebook). Warns instead of failing.
        run: python scripts/update_social.py

      - name: Update Instagram engagement
        # Meta Business Discovery. Without the secrets, or with an expired token, warns and skips.
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python scripts/update_engagement.py

      - name: Refresh simulator data
        # Same Wikipedia page, parsed with every scenario and the second-round duels,
        # then exported with today's date to data/model.js.
        run: |
          curl -sf -m 60 -A "road-to-2027-poll-updater/1.0" \
            "https://en.wikipedia.org/w/index.php?title=Opinion_polling_for_the_2027_French_presidential_election&action=raw" \
            -o backtest/raw/polls_2027.txt
          python backtest/parse_history.py backtest/raw/polls_2027.txt backtest/data/polls_2027.json
          python backtest/duels.py backtest/raw/polls_2027.txt backtest/data/duels_2027.json
          python backtest/export_model.py

      - name: Validate generated data
        run: |
          python scripts/validate_data.py
          # Raw Wikipedia text has trailing spaces: only check the generated files.
          git diff --check -- data/ backtest/data/

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/update-polls
          delete-branch: true
          commit-message: "chore(data): update opinion polls"
          title: "chore(data): update opinion polls"
          body: |
            Automated update generated by `scripts/update_polls.py` (tracker polls),
            `scripts/update_social.py` (followers, Le Podium 2027) and
            `backtest/export_model.py` (simulator).

            Please review the latest polls against their original sources, and any
            warning in the workflow log before merging: follower jumps, or a polled
            candidate missing from `backtest/candidates_2027.py` (counted in
            "Autres candidats" until added there).
          add-paths: |
            data/polls.js
            data/social.js
            data/engagement.js
            data/model.js
            backtest/raw/polls_2027.txt
            backtest/data/polls_2027.json
            backtest/data/duels_2027.json
