name: Update opinion polls

on:
  schedule:
    # Every Monday and Thursday at 06:00 UTC (07:00 in Paris during winter).
    - cron: "0 6 * * 1,4"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-polls
  cancel-in-progress: false

jobs:
  update-polls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update polls
        run: python scripts/update_polls.py

      - name: Update social followers
        # Le Podium 2027 (X, Instagram, TikTok, Facebook). Warns instead of failing.
        run: python scripts/update_social.py

      - name: Update Instagram engagement
        # Meta Business Discovery. Without the secrets, or with an expired token, warns and skips.
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python scripts/update_engagement.py

      - name: Refresh simulator data
        # Same Wikipedia page, parsed with every scenario and the second-round duels,
        # then exported with today's date to data/model.js.
        run: |
          curl -sf -m 60 -A "road-to-2027-poll-updater/1.0" \
            "https://en.wikipedia.org/w/index.php?title=Opinion_polling_for_the_2027_French_presidential_election&action=raw" \
            -o backtest/raw/polls_2027.txt
          python backtest/parse_history.py backtest/raw/polls_2027.txt backtest/data/polls_2027.json
          python backtest/duels.py backtest/raw/polls_2027.txt backtest/data/duels_2027.json
          python backtest/export_model.py

      - name: Validate generated data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/polls.js")
          content = path.read_text(encoding="utf-8")
          prefix = "window.POLLS = "
          if prefix not in content:
              raise SystemExit("Unexpected generated file format")
          payload_text = content.split(prefix, 1)[1].rsplit(";", 1)[0]
          payload = json.loads(payload_text)

          if not isinstance(payload.get("polls"), list):
              raise SystemExit("Invalid polls payload")
          if not payload["polls"]:
              raise SystemExit("No polls were generated")

          required_fields = {"firm", "url", "start", "date", "sample", "scenarios"}
          for i, poll in enumerate(payload["polls"]):
              missing = required_fields - poll.keys()
              if missing:
                  raise SystemExit(
                      f"Poll {i + 1} is missing fields: {', '.join(sorted(missing))}"
                  )

              if not poll["url"]:
                  raise SystemExit(f"Poll {i + 1} has an empty URL")

              if poll["start"] > poll["date"]:
                  print(
                      f"::warning::Poll {i + 1} has start date after end date: "
                      f"{poll['start']} > {poll['date']}"
                  )

          print(f"Successfully validated {len(payload['polls'])} polls")

          model_text = Path("data/model.js").read_text(encoding="utf-8")
          model = json.loads(model_text.split("window.MODEL = ", 1)[1].rsplit(";", 1)[0])
          if not model.get("candidates") or not model.get("sigma_first"):
              raise SystemExit("Invalid simulator model")
          if model["n_polls"] == 0:
              print("::warning::No 2027 poll in the last 21 days: simulator base unchanged")
          print(f"Simulator model as of {model['asof']}: {model['n_polls']} polls, {len(model['duels'])} duels")

          social_text = Path("data/social.js").read_text(encoding="utf-8")
          social = json.loads(social_text.split("window.SOCIAL = ", 1)[1].rsplit(";", 1)[0])
          for cid, nets in social["followers"].items():
              for net, acc in nets.items():
                  for pt in acc["points"]:
                      if not pt.get("source") or not isinstance(pt.get("value"), int) or pt["value"] <= 0:
                          raise SystemExit(f"Invalid follower point: {cid} {net} {pt}")
          print(f"Social data as of {social['updated']}")

          eng_text = Path("data/engagement.js").read_text(encoding="utf-8")
          eng = json.loads(eng_text.split("window.ENGAGEMENT = ", 1)[1].rsplit(";", 1)[0])
          for cid, acc in eng["candidates"].items():
              for e in acc.get("history", []):
                  if e.get("rate") is not None and not (0 <= e["rate"] < 100):
                      raise SystemExit(f"Implausible engagement rate: {cid} {e['date']} {e['rate']}")
                  if any("SAMPLE" in (p.get("url") or "") for p in e.get("posts", [])):
                      raise SystemExit("Sample data found in data/engagement.js")
          print(f"Engagement data as of {eng['updated']}")
          PY
          # Raw Wikipedia text has trailing spaces: only check the generated files.
          git diff --check -- data/ backtest/data/

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/update-polls
          delete-branch: true
          commit-message: "chore(data): update opinion polls"
          title: "chore(data): update opinion polls"
          body: |
            Automated update generated by `scripts/update_polls.py` (tracker polls),
            `scripts/update_social.py` (followers, Le Podium 2027) and
            `backtest/export_model.py` (simulator).

            Please review the latest polls against their original sources, and any
            warning in the workflow log before merging: follower jumps, or a polled
            candidate missing from `backtest/candidates_2027.py` (counted in
            "Autres candidats" until added there).
          add-paths: |
            data/polls.js
            data/social.js
            data/engagement.js
            data/model.js
            backtest/raw/polls_2027.txt
            backtest/data/polls_2027.json
            backtest/data/duels_2027.json
