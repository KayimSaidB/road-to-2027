name: Update opinion polls

on:
  schedule:
    # Every Monday at 06:00 UTC (07:00 in Paris during winter).
    - cron: "0 6 * * 1,4"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-polls
  cancel-in-progress: false

jobs:
  update-polls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update polls
        run: python scripts/update_polls.py

      - name: Validate generated data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/polls.js")
          content = path.read_text(encoding="utf-8")
          prefix = "window.POLLS = "
          if prefix not in content:
              raise SystemExit("Unexpected generated file format")
          payload_text = content.split(prefix, 1)[1].rsplit(";", 1)[0]
          payload = json.loads(payload_text)

          if not isinstance(payload.get("polls"), list):
              raise SystemExit("Invalid polls payload")
          if not payload["polls"]:
              raise SystemExit("No polls were generated")

          required_fields = {"firm", "url", "start", "date", "sample", "scenarios"}
          for i, poll in enumerate(payload["polls"]):
              missing = required_fields - poll.keys()
              if missing:
                  raise SystemExit(
                      f"Poll {i + 1} is missing fields: {', '.join(sorted(missing))}"
                  )

              if not poll["url"]:
                  raise SystemExit(f"Poll {i + 1} has an empty URL")

              if poll["start"] > poll["date"]:
                  print(
                      f"::warning::Poll {i + 1} has start date after end date: "
                      f"{poll['start']} > {poll['date']}"
                  )

          print(f"Successfully validated {len(payload['polls'])} polls")
          PY
          git diff --check

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/update-polls
          delete-branch: true
          commit-message: "chore(data): update opinion polls"
          title: "chore(data): update opinion polls"
          body: |
            Automated weekly update generated by `scripts/update_polls.py`.

            Please review the latest polls against their original sources before merging.
          add-paths: |
            data/polls.js
