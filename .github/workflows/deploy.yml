
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Collect site files
        # Only what the browser loads: no backtest data, scripts or workflows.
        run: |
          mkdir -p _site/data
          cp index.html app.js sandbox.js _site/
          cp data/*.js _site/data/
          ls -R _site

      - name: Upload static files
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
