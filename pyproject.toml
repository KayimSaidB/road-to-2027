# Python side of the project: the road2027 package (src/road2027, shared code), the data
# scripts (scripts/), the backtest (backtest/) and tests. The site itself has no dependency.
#
#   pip install -e . --group dev       # local development: package (editable) + tests + lint
#   pip install . --group scripts      # what the update-polls workflow needs
#
# Dependency groups (PEP 735) need pip >= 25.1.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "road2027"
version = "0.1.0"
description = "Shared code for the Road to 2027 data scripts and backtest"
requires-python = ">=3.12"
dependencies = []  # standard library only

[dependency-groups]
scripts = ["pydantic==2.13.5"]
dev = [
    { include-group = "scripts" },
    "pytest==8.3.2",
    "ruff==0.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# scripts/ is not a package: let tests import validate_data and update_polls directly.
# road2027 is imported from the installed package, never from the source tree.
pythonpath = ["scripts"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Ruff defaults (pyflakes F + pycodestyle E4/E7/E9), minus the compact style this
# codebase uses on purpose: `import a, b`, one-liners with ; and :, short names like `l`.
ignore = ["E401", "E701", "E702", "E731", "E741"]

[tool.ruff.lint.per-file-ignores]
# sys.path.insert(...) must run before importing sibling modules.
"backtest/*.py" = ["E402"]
